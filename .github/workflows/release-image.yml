name: Release Docker image

# Builds nothing. ci.yml already built and pushed this exact commit as
# :sha-<sha>, so releasing is a registry-side manifest copy -- seconds rather
# than a full rebuild.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Pushing master and the tag together is the normal flow here, so ci.yml
      # is usually still building when this starts. Wait for it instead of
      # racing it; 10 min is well past a cold build of this Dockerfile.
      - name: Wait for master's build of this commit
        run: |
          image=ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          timeout 600 bash -c 'until docker buildx imagetools inspect "$0" >/dev/null 2>&1; do sleep 10; done' "$image" \
            || { echo "::error::$image was never published -- did master's build fail?"; exit 1; }

      - name: Promote to ${{ github.ref_name }} and latest
        run: |
          image=ghcr.io/${{ github.repository }}
          docker buildx imagetools create \
            --tag "$image:${GITHUB_REF_NAME#v}" \
            --tag "$image:latest" \
            "$image:sha-${{ github.sha }}"

      # `gh` is preinstalled on the runner, so this needs no action and no
      # checkout -- GH_REPO stands in for the git remote.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
