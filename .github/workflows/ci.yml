name: CI

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  # Gated on tests, unlike before: this job now publishes, and
  # release-image.yml promotes what it publishes straight to :latest. A red
  # master must not be able to produce a release candidate.
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # guards against an accidental multi-arch build under QEMU
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          # `source` is what links the GHCR package back to this repo.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
